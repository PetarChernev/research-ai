schema_version: 1
id: "O003"
title: >-
  Field-space curl and complete primitive

# Scientific targets. At least one claim or derivation should be linked once the
# obligation is attached to the research record.
claims: ["C014"]
derivations: ["D005"]

# Generic, method-neutral classification. Allowed values:
#   exact-symbolic | formal | numerical | convergence | independent-implementation
#   limiting-case | symmetry | dimensional | counterexample | other
# The class describes what kind of assertion is being tested. It does not select
# a library, language, or tool; the research chooses the method.
class: "exact-symbolic"

# required: true means this obligation is part of the currently declared
# verification strategy for its target claims. A required active obligation
# without a passing result blocks the structural computational gate.
required: true

# active | superseded. Superseded obligations remain durable history and do not
# block the current strategy. Do not delete failed history to clear the gate.
status: active

# The exact mathematical question tested, stated so that a reader can tell what
# is NOT tested.
question: >-
  On a certified nonzero one-mode restriction of D005's basic normalized boundary sector, is the isolated field-space one-form A=q^2*nu*dw nonclosed whenever the coframe amplitude q or vertical normalization nu varies, while B=(w-a)*q^2*nu has exactly the required connection, reference, coframe, and normalization companion terms and satisfies d_F^2 B=0?

# Assumptions the executable check encodes: conventions, normalizations, domains,
# regularity, parameter ranges, representation choices, and anything the
# implementation takes for granted.
assumptions:
  - >-
    The check is restricted to D005's fixed interface and persistent local
    SO(1,3) sector.  A local trivialization with g equal to the identity is used
    only to select a mode; omega_+ and the dressed reference bar(a) remain
    distinct, and no global bundle or gauge-orbit statement is encoded.
  - >-
    Internal indices are ordered 0,1,2,3 with epsilon_0123=+1, antisymmetric
    connection components are summed over both ordered values, the oriented
    base chart is dx0 wedge dx1 wedge dx2, and the oriented circle has
    integral eta_0=+2*pi.  The exact symbol b=2*pi*gamma is absorbed into the
    connection-mode normalization; no floating representation of pi is used.
  - >-
    The nonzero mode is omega_+^{01}=w*beta0, bar(a)^{01}=a*beta0,
    e_+^2=q*beta1, e_+^3=q*beta2, with antisymmetric 10 components and all
    other active components zero.  Here beta0=(b*J)^(-1)*phi*dx0,
    beta1=phi*dx1, beta2=phi*dx2, phi is a positive C-infinity bump supported
    in a precompact cube, and J=int_Sigma phi^3 d^3x>0.  Thus
    int_Sigma b*beta0 wedge beta1 wedge beta2=1 exactly; b is assumed nonzero.
  - >-
    The persistent mode forms and their coefficients are horizontal and
    theta-independent, hence pulled back from Sigma.  A smooth cutoff chi is
    compactly supported in a larger precompact cube and equals one on
    supp(phi).  The vertical-density family is
    eta(nu)=eta_0+(nu-1)*chi*eta_0: nu=1 is the normalized principal connection,
    while d_nu eta=chi*eta_0 is the compactly supported unconstrained vertical
    variation of D005, not a tangent to normalized principal connections.
  - >-
    Variations generated by partial_w, partial_a, partial_q, and partial_nu
    have compact base support away from corners (the circle is compact) and
    commute.  Horizontal normalized-connection variations are absent because
    D005's basic three-form times a fourth horizontal leg vanishes; only the
    vertical normalization coordinate nu is represented.
  - >-
    After the exact spacetime/internal contraction, the represented field
    space is affine with commuting coordinates (w,a,q,nu).  Coefficients lie in
    the free rational polynomial ring and field one-forms have the declared
    order dw < da < dq < dnu, with anticommuting wedge generators and closed
    basis one-forms.
  - >-
    Polynomial and exterior-form equality is equality of the kernel's
    canonical sparse maps: polynomial monomials are collected, field
    differential tuples are sorted with exact permutation signs, repeated
    differentials vanish, and no tolerance, random sample, branch heuristic,
    or simplify-like oracle is used.
  - >-
    The mode is an exact restriction used to witness nonclosure and recover the
    complete primitive.  It does not assert that every field configuration is
    one-mode, that the active coframe is a global rank-three solution, or that
    the finite restriction classifies the full infinite-dimensional field
    space.

# Predeclared pass/fail/inconclusive criterion. Write this before implementing.
acceptance_criterion: >-
  Pass iff exact field-space normal forms give d_F A=(2*q*nu*dq+q^2*dnu) wedge dw nonzero, d_F B=q^2*nu*(dw-da)+2*q*nu*(w-a)*dq+q^2*(w-a)*dnu, and d_F^2 B=0; free-q and free-nu controls separately give nonzero curl; fixing q and nu gives zero curl; the selected mode is certified nonzero and admissible; and deleting or sign-perturbing each companion term is detected. Fail on any exact mismatch. Inconclusive only if the selected mode has zero spacetime/internal contraction or lies outside the declared basic compact-support variation class; implementation exceptions are errors.

method:
  description: >-
    Exact polynomial field-space exterior differentiation on a nonzero normalized mode, with canonical anticommuting field differentials and explicit mutation controls.
  rationale: >-
    A single nonzero mode is an exact restriction that can witness nonclosure, while complete polynomial differentiation checks every companion term without claiming to formalize the entire infinite-dimensional field space.
  representation: >-
    The spacetime certification uses a sparse three-generator exterior algebra,
    explicit ordered internal epsilon enumeration, and an exact one-dimensional
    normalized integration functional.  The claim calculation uses polynomial
    differential forms on affine Q[w,a,q,nu] with basis (dw,da,dq,dnu).
  equality: >-
    Equality is decidable canonical map equality over fractions.Fraction.
    The expected curl and complete first variation are independently assembled
    term by term; zero means an empty canonical map.
  trust_surface: >-
    Trusted conclusion-critical code consists of Python integer/Fraction
    arithmetic, the public Polynomial/ExteriorAlgebra/ExteriorForm and
    levi_civita_sign API in exact_graded, the hand-entered mode/component table,
    and the compact direct dense evaluator of D005 equation (28).  No CAS,
    numerical library, float, random generator, or external executable is an
    equality oracle.  The existing frozen kernel is adequate; writing another
    general algebra would add more risk than it removes.

controls:
  positive:
    - "P01: ordered internal/spacetime enumeration has four positive contributions and normalized total +1"
    - "P02: persistent legs are basic, eta_0 has positive unit winding, and exact nested support data put every amplitude variation in the compact-support class"
    - "P03: d_F A equals (2*q*nu*dq+q^2*dnu) wedge dw and is nonzero"
    - "P04: free-q and free-nu restrictions are separately nonzero, while fixing q and nu gives zero curl"
    - "P05: d_F B contains the exact +dw, -da, +dq, and +dnu terms and its connection term is A"
    - "P06: a second field derivative gives d_F^2 B=0 exactly"
    - "P07: a direct dense ordered-index evaluation of D005 equation (28), without the shared field_derivative path, gives 6 on (partial_q,partial_w) and 9 on (partial_nu,partial_w) at q=3,nu=1"
  negative:
    - "N01: replacing the third spacetime mode leg by the second makes the certified contraction exactly zero"
    - "N02: omitting each of connection, reference, coframe, and vertical-normalization terms is unequal to d_F B"
    - "N03: reversing the sign of each of those four terms is unequal to d_F B"
    - "N04: the direct curl changes sign when the two commuting variations are exchanged and vanishes for the fixed-q/fixed-nu connection-reference pair"
  mutations:
    - "M01: process-local O003_INTERNAL_MUTATION=omit-coframe removes the dq companion from the candidate complete variation and must make the entrypoint exit 1"

implementation:
  # Repository-relative entrypoint executed by scripts/run_check.py.
  entrypoint: "research/checks/O003/run.py"
  # Repository-relative reusable machinery this obligation depends on, normally
  # under research/computation/. Also list material research-environment
  # manifests, locks, container definitions, and build records under
  # research/environment/. The runner fingerprints files and directories, so a
  # change makes the recorded result stale.
  infrastructure:
    - "research/computation/exact_graded"
    - "pyproject.toml"
    - "uv.lock"
    - "scripts/run_check.py"
    - "scripts/_research.py"
  producer_models: ["openai/gpt-5.6-sol"]
  producer_roles:
    scientific_computation: "openai/gpt-5.6-sol"
    exact_graded_engineer: "openai/gpt-5.6-sol"

independence:
  # not-required | recommended | required
  requirement: "required"
  rationale: >-
    C014 is conclusion-critical for the repaired action. An alternate check must evaluate the original curl directly on two explicit commuting variations rather than share the polynomial differential implementation.
  alternate_method: >-
    run.py directly evaluates D005 equation (28) by dense ordered internal-index
    loops and a hand-written three-form determinant at the normalized field
    point q=3, nu=1.  It uses explicit constant commuting variations and never
    calls Polynomial, ExteriorForm.field_derivative, or the sparse field-space
    result.  It shares the declared physical mode and is therefore an alternate
    method check, not a fully independent scientific verification.

