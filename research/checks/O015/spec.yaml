schema_version: 1
id: "O015"
title: >-
  Lowest-derivative reduction-action exhaustion

# Scientific targets. At least one claim or derivation should be linked once the
# obligation is attached to the research record.
claims: ["C028"]
derivations: ["D025"]

# Generic, method-neutral classification. Allowed values:
#   exact-symbolic | formal | numerical | convergence | independent-implementation
#   limiting-case | symmetry | dimensional | counterexample | other
# The class describes what kind of assertion is being tested. It does not select
# a library, language, or tool; the research chooses the method.
class: "exact-symbolic"

# required: true means this obligation is part of the currently declared
# verification strategy for its target claims. A required active obligation
# without a passing result blocks the structural computational gate.
required: true

# active | superseded. Superseded obligations remain durable history and do not
# block the current strategy. Do not delete failed history to clear the gate.
status: active

# The exact mathematical question tested, stated so that a reader can tell what
# is NOT tested.
question: >-
  Under C028's exact fixed-interface assumptions and purely algebraic operator quotient—SO(1,4) invariants generated only by a unit spacelike V, E, K=D_omega V, eta, epsilon, exterior degree four, and at most one K—does exhaustive finite contraction reduction give exactly one zero-K invariant I0 and one one-K invariant I1; and does complete independent variation of integral(lambda I0+gamma I1), followed by addition of the D004 polar row, yield an empty coefficient solution set for simultaneous mixed-43 cancellation and free rank-three c>0 triad-rescaling stationarity?

# Assumptions the executable check encodes: conventions, normalizations, domains,
# regularity, parameter ranges, representation choices, and anything the
# implementation takes for granted.
assumptions:
  - >-
    The operator class is exactly C028's purely algebraic quotient: local
    orientation-preserving SO(1,4) scalar polynomial four-forms generated by
    V, E, K=D_omega V, eta, epsilon and constant coefficients, with V^2=1,
    V.K=0, exterior degree four and at most one K. Total/covariant derivatives,
    integration-by-parts action equivalence and any larger jet complex are not
    quotient relations.
  - >-
    Internal signature is eta=diag(-,+,+,+,+), epsilon_01234=+1, and both
    orders of every antisymmetric pair are retained. The interface orientation
    is oY=oSigma wedge dtheta with fiber forms moved right, positive core
    incidence and formal ordinary period tau=2*pi.
  - >-
    The polar support is V=e4, K3=-c dtheta, E0,E1,E2 the three independent
    horizontal coframes, pulled-back E3=E4=0, Pi43=-oSigma/2 and Pi34=+oSigma/2.
    Coframe, connection and V are varied independently before adapted gauge;
    c>0 and kappa_5 is finite and nonzero.
  - >-
    The executable tests only the finite invariant algebra and coefficient
    bridge. It assumes the D022 positive D004 mixed row and the frozen D005
    on-shell incidence, and excludes curvature, DE, DK, K^2, Hodge/inverse
    coframes, extra fields, tangent admissibility, global gauge sectors,
    functional preservation and C002/C003.

# Predeclared pass/fail/inconclusive criterion. Write this before implementing.
acceptance_criterion: >-
  Pass iff one deterministic exact execution, without quotienting total
  derivatives or integration by parts at the action-class stage: (i)
  exhaustively generates the eta/epsilon/V contraction space for four exterior
  one-form slots in the zero-K and one-K sectors, reduces only V^2=1, V.K=0,
  invariant-tensor identities and wedge antisymmetry, and obtains ranks (1,1)
  with normalized representatives I0=(1/4!) epsilon(V,E,E,E,E) and
  I1=(1/3!) epsilon(V,K,E,E,E), while every eta-only and V.E candidate reduces
  to zero; (ii) independently differentiates the generic primitive
  lambda I0+gamma I1 in omega, E and V using
  delta K=D(delta V)+delta omega V, performs only variation-level graded
  integration by parts while retaining the minus V corner, and recovers the
  stated connection, coframe and V rows; (iii) on the ordered-pair polar
  support reconstructs I0=0, I1=-c oSigma wedge dtheta and exact coefficients
  tau*(kappa_5^{-1}-gamma) for delta chi43,
  -3*tau*gamma*c for common triad rescaling and tau*lambda for the transverse
  delta E3 row, where tau=2*pi, together with zero transverse V residual and
  zero basic corner pullback; (iv) exact elimination under c>0 and finite
  nonzero kappa_5 returns no solution to mixed cancellation plus rescaling
  stationarity and returns lambda=gamma=0 for the new coframe rows alone; and
  (v) a two-K domain-boundary control changes the invariant rank, the positive
  domain API rejects any exact/IBP action quotient, and fresh-process semantic
  mutations omitting one antisymmetric-pair order, deleting the I1 coframe
  companion, freezing delta K before variation, reversing the fiber-form sign,
  replacing the graded Noether identity by the all-plus form, or changing the
  domain API to accept the undeclared exact/IBP quotient each exit 1. Fail on
  any mismatch, incomplete contraction orbit, ineffective required mutation,
  or acceptance of an undeclared quotient. Inconclusive only if a declared
  exact-domain operation cannot be represented; implementation exceptions are
  errors.

method:
  description: >-
    Claim-local exact invariant-contraction enumeration plus canonical sparse exterior/field-variation algebra and exact coefficient elimination.
  rationale: >-
    C028's decisive new content is a finite algebraic class-exhaustion rank and a finite three-coefficient incompatibility. Exact canonical enumeration and graph-derived variation can discriminate missed contractions, factors, signs, and premature restrictions more strongly than sampling or another hand reconstruction, while a general CAS or larger differential-jet framework would add an unnecessary and scientifically different trust surface.
  representation: >-
    Self-contained exact contraction diagrams, adapted-frame eta/epsilon
    evaluation, canonical sparse exterior/graded polynomials over Fraction,
    exact rational row reduction, and an upstream expression graph for complete
    field variation. Equality is canonical sparse-map equality.
  trust_surface: >-
    Trusted executable machinery is Python integer/Fraction arithmetic and the
    claim-local diagram, wedge, graph, derivative, substitution, and RREF code.
    The analytic premise that orientation-preserving SO(1,4) invariant tensors
    are generated by eta and epsilon, with two epsilons reducible to metric
    determinants, remains trusted. No CAS, package, sampling, reusable research
    kernel, differential quotient, or Engineer contribution is used.
  covariance_and_controls: >-
    Covariant eta/epsilon/V diagrams are generated before evaluation at V=e4,
    a representative of the unit-spacelike orbit. Arbitrary V powers reduce via
    V2=1, V.K=0, repeated-V epsilon zero, or explicit V.E legs. Eta-only and
    V.E candidates, a two-K boundary sector, a separate polar assembly, and six
    fresh-process semantic mutations are retained.

implementation:
  # Repository-relative entrypoint executed by scripts/run_check.py.
  entrypoint: "research/checks/O015/run.py"
  # Repository-relative reusable machinery this obligation depends on, normally
  # under research/computation/. Also list material research-environment
  # manifests, locks, container definitions, and build records under
  # research/environment/. The runner fingerprints files and directories, so a
  # change makes the recorded result stale.
  infrastructure:
    - "pyproject.toml"
    - "scripts/_research.py"
    - "scripts/run_check.py"
    - "uv.lock"
  producer_models: ["openai/gpt-5.6-sol"]
  infrastructure_producer_models: ["openai/gpt-5.6-sol"]

independence:
  # not-required | recommended | required
  requirement: "recommended"
  rationale: >-
    D025, its critics, and the planned check share OpenAI provenance and D022-D024 conventions. Separate contraction-orbit enumeration, graph-derived variation, direct polar assembly, and semantic mutations are proportionate correlated controls for this restricted intermediate claim; they are not independent verification, and no second implementation or Opus audit is warranted in this cycle.

