  # research/environment/. The runner fingerprints files and directories, so a
  # change makes the recorded result stale.
  infrastructure:
    - "research/computation/exact_graded"
    - "pyproject.toml"
    - "scripts/_research.py"
    - "scripts/run_check.py"
    - "uv.lock"
  producer_models: ["openai/gpt-5.6-sol"]
  infrastructure_producer_models: ["openai/gpt-5.6-sol"]

independence:
  # not-required | recommended | required
  requirement: "required"
  rationale: >-
    C015 is the current frontier's load-bearing legacy result. Alternate reconstruction must derive the branch equations without differentiating the encoded action and derive the H kernel from the adapted M/S decomposition rather than shared row-reduction code.

