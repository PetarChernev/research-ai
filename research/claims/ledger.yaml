    status: derived
    importance: critical
    hypotheses: [H001, H002, H003]
    assumptions:
      - The interface is fixed and timelike; outer and corner variations are excluded by compact support.
      - Coframes, tangent connection variations, and any curvature used in the Lovelock extension obey the smooth D002 equalizer.
      - The actions, ordered antisymmetric-index convention, orientations, and couplings are exactly those in D004.
      - The extension to polynomial Lovelock bulk terms applies only when the complete potential is a regular descended four-form; boundary, transgression, singular, and independent blow-up terms are excluded.
