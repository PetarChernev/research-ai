  - id: C006
    claim: >-
      At least one action passing C001-C003 admits an asymptotically flat, finite-ADM-mass, timelike-world-tube solution with a Q=1 Hopf-framed exactly d=5 core and exactly d=4 exterior, and its complete gauge-reduced linear fluctuation spectrum contains no mode with negative kinetic norm or exponentially growing frequency.
    status: conjecture
    importance: critical
    hypotheses: [H001, H002, H003, H004]
    assumptions:
      - The continuum solution scale is parametrically larger than the ultraviolet cutoff length.
      - Exact exterior collapse and finite ADM mass are imposed as boundary conditions derived from the action.
      - The fluctuation basis includes nonspherical, framing, torsional, interface, merger/fragmentation, and rank-changing modes permitted by the theory.
