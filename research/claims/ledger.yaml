  - id: C016
    claim: >-
      In the fixed-interface basic persistent SO(1,3) sector of D005, restricted to the planar rank-three branch b=1/kappa_4 and H(K)=0, the interface/edge action has a fixed-reference cut presymplectic form of rank 12 off shell that pulls back to zero when Pi=Q+lambda=0, whereas the Stueckelberg gauge-orbit reference has an additional shell presymplectic block of rank 10 (five pairs) and a generically nonzero temporal-corner moment map proportional to Ad_(g^-1)Q; nevertheless these interface data alone do not decide whether that block is physical or removed by first-class gauge because the total bulk Lorentz Gauss generators, boundary polarization, and admissible reference/seed/corner transformations are not specified.
    status: verified
    importance: critical
    hypotheses: [H002, H003]
    assumptions:
      - The interface is fixed and timelike, the marked circle period is fixed, and only basic theta-independent persistent SO(1,3) fields are retained.
      - The planar pullback is e_+^0=dt, e_+^1=dx^1, e_+^2=dx^2, e_+^3=0 with b=1/kappa_4 and H(K)=0.
      - The algebraic shell Delta e=Delta omega=0, lambda=-Q, mu=0 and Q=g.P^- is imported from the combined D005 bulk-plus-interface variation, while all bulk kinetic and Gauss terms are deliberately omitted from the cut-rank calculation.
      - Rank is pointwise for small Lorentz transformations in a local trivialization; global topology, reducibility, moving interfaces, full SO(1,4), nonbasic modes, and hyperbolicity are excluded.
      - Temporal and lateral corner conditions are not silently fixed; compact-support and nonvanishing-corner transformation classes are distinguished.
