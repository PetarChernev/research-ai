  - id: C008
    claim: >-
      For the benchmark in C007, the smooth-function algebras transported to the common topological quotient obey C_infinity,2 strictly contained in C_infinity,1 strictly contained in C_infinity,q; the canonical horn homeomorphism from profile rho_1 to rho_2 is smooth, but its inverse has no locally ambient C1 extension and fails the ambient-subdiffeology plot test, so the two embedding-induced differential spaces are not diffeomorphic under this canonical comparison.
    status: derived
    importance: high
    hypotheses: [H001, H002, H003]
    assumptions:
      - Smooth horn functions are restrictions of ambient C-infinity functions, and the nonsmooth inverse is also tested with the ambient sub-diffeologies.
      - The canonical comparison preserves the base normal coordinate and circle label rather than allowing an arbitrary abstract horn homeomorphism.
      - The asymptotic profile ordering rho_2/rho_1 -> 0 is used only after shrinking toward s=0 from the core.
