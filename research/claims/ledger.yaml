      For the quotient-form equalizer and connection choices defined in the C007 benchmark, dtheta+A does not descend, whereas rho_i(dtheta+A), horizontal A, F=dA, and horizontal theta-independent mixed connection components do descend; if an Ehresmann or independent SO(1,4) connection is retained on the nondegenerate rank-four exterior, ordinary U(1) or Lorentz gauge cannot map the displayed nonzero F or coframe-relative mixed curvature to zero, while a coframe-only state omits those independent data, an explicitly enlarged exterior-forgetful equivalence discards them, and future equations or boundary conditions could exclude them.
    status: derived
    importance: critical
    hypotheses: [H001, H002, H003]
    assumptions:
      - Quotient forms are defined by the kernel-pair equalizer in D002 with the fiber-product diffeology.
      - A is smooth, horizontal, and theta-independent; mixed connection components are assessed in the declared horizontal theta-independent sector.
      - Ordinary gauge means the explicit vertical U(1) action or local SO(1,4) frame action, not the separately defined exterior-forgetful relation.
      - No claim is made that independent connection data must be included in a coframe-only physical state.
      - The coframe-relative mixed projection uses the internal unit normal to the nondegenerate rank-four exterior image and is not asserted on the intrinsic rank-three interface tangent.
