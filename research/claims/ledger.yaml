    status: derived
    importance: critical
    hypotheses: [H001, H002, H003]
    assumptions:
      - The core and exterior persistent SO(1,3) bundles are isomorphic at the fixed interface and are related by the varied edge field g.
      - Fields are basic along a marked normalized circle, and mixed SO(1,4), nonbasic Kaluza-Klein, moving-interface, and corner sectors are excluded except for the displayed candidate corner moment maps.
      - The master action and ordered-pair, orientation, ordinary-circle normalization conventions are exactly those in D005.
      - The fixed reference transforms geometrically as connection data; freezing its coordinate coefficients without transformation would reduce gauge symmetry and is not covered by the positive branch.
