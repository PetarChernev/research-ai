    status: derived
    importance: critical
    hypotheses: [H001, H002, H003]
    assumptions:
      - Forms are C-infinity members of the exact D002 quotient equalizer and extend smoothly to the resolved core closure.
      - Test forms have compact support away from all outer slab boundaries.
      - The core, exterior, interface, and circle orientations are those fixed in D003; normalized Haar means one over 2pi times ordinary circle integration.
      - Singular, polyhomogeneous, finite-regularity, distributional, and independent blow-up boundary forms are excluded.
