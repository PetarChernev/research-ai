  - id: C004
    claim: >-
      In the fully defined admissible configuration spaces of a stable Q=1 Hopf-framed dimensional defect, inclusion of the based Hopf-map sector sends its nontrivial pi_1 element injectively into the one-defect space, and in the two-unit-defect space a physical 2pi rotation of one defect and exchange of the two defects represent the same nontrivial order-two loop even when core overlap and all allowed rank-changing histories are admitted.
    status: conjecture
    importance: critical
    hypotheses: [H004, H005]
    assumptions:
      - A stable localized defect and full admissible one- and two-defect configuration spaces have been defined.
      - Hopf charge and framing remain meaningful under every admitted overlap and rank-changing history.
      - Gauge transformations and labeling/permutation quotients are included in the physical configuration spaces.
