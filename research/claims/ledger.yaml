  - id: C002
    claim: >-
      On at least one state space satisfying C001, there exists a local Lorentz- and diffeomorphism-covariant first-order action for d in {4,5} that is defined without an inverse coframe at rank change, has a differentiable first variation under all declared bulk and transition-displacement variations, and yields both bulk and transition equations without separately imposed matching conditions.
    status: conjecture
    importance: critical
    hypotheses: [H001, H002, H003]
    assumptions:
      - Locality means dependence on finitely many fields and derivatives on strata plus finite transition data.
      - The action may contain required boundary, corner, incidence, or transgression terms.
      - The nondegenerate limits are the declared four- and five-dimensional first-order gravity theories.
