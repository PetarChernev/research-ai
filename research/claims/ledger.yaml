  - id: C007
    claim: >-
      For the local quotient X=[U x (-epsilon,epsilon) x S1]/~ that identifies each full circle exactly when s<=0, the two flat-profile maps F_i=(u,s,rho_i cos(theta),rho_i sin(theta)) with rho_1=ell exp[-(L/s)^2] and rho_2=ell exp[-(L/s)^4] on s>0 and zero otherwise induce homeomorphisms onto their horn images; X has regular strata of dimensions five and four and a three-dimensional interface, a neighborhood in X of each interface point is locally homeomorphic to R^{1,2} x C(S1 disjoint_union point), and there the local covering dimension is five, quotient-algebra derivation dimension is four, and ambient-embedding derivation dimension is six.
    status: derived
    importance: high
    hypotheses: [H001, H002, H003]
    assumptions:
      - U is an open three-coordinate slab with one designated timelike coordinate and s is spacelike.
      - The quotient topology, final quotient smooth algebra, and locally ambient-extendible horn algebras are exactly those defined in D002.
      - Both collapse profiles are C-infinity flat and the comparison uses the canonical homeomorphism preserving u, s, and the core circle label.
