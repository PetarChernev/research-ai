  - id: C005
    claim: >-
      For the microscopic theory and configuration spaces in C004, restriction to a conserved odd opened-fiber momentum k uniquely induces a quantum line bundle whose holonomy is -1 on the common nontrivial rotation/exchange loop, so the fermionic Finkelstein-Rubinstein character is fixed by the action and constraints rather than chosen independently; the lowest allowed spatial-rotation multiplet at |k|=1 has j=1/2.
    status: conjecture
    importance: critical
    hypotheses: [H004, H005]
    assumptions:
      - A globally valid fiber bundle/collective coordinate and conserved integer k exist in the defect sector.
      - The collective-coordinate reduction includes all Berry and topological terms and is valid below noncollective excitations.
      - No additional compatible flat line-bundle twist remains after imposing microscopic constraints and regularity.
