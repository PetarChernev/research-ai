claims:
  - id: C001
    claim: >-
      For a declared controlled class of Lorentzian circle-collapse configurations with only d=4 and d=5 regular open strata, there exists an intrinsic generalized-space state description in which local dimension, differential/integration data, causal curves, and a topology on configuration space are defined, and every designated physical observable is invariant under all resolution morphisms declared to represent the same physical configuration.
    status: conjecture
    importance: critical
    hypotheses: [H001, H002, H003]
    assumptions:
      - The transition is restricted to a controlled spacelike-circle collapse with one persistent timelike direction.
      - The admissible regularity class, morphisms, and set of designated observables are fixed before testing invariance.
      - A finite amount of transition control data is allowed.
