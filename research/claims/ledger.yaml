      - The two profiles are treated either as distinct physical coframes or, conditionally, as alternative resolutions of one bare quotient; these interpretations are not conflated.
      - The candidate stratified functional uses independent top-degree forms on the 5D, 4D, and 3D strata rather than one homogeneous form of changing degree.
