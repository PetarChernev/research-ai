  - id: C003
    claim: >-
      At least one action satisfying C002 has a planar or regular-polar circle-collapse background for which the complete linearized Dirac system has a regular branchwise constraint classification and compatible transition constraints defining a deterministic global reduced phase space with no arbitrary nongauge functions, while the gauge-fixed initial-transition problem is strongly hyperbolic and the reduced quadratic kinetic form has no negative eigenvalue.
    status: conjecture
    importance: critical
    hypotheses: [H001, H002, H003]
    assumptions:
      - The background and perturbation regularity class include all physical interface and coframe/connection modes.
      - Gauge and constraint modes are removed before assessing kinetic signs.
      - Strong hyperbolicity is tested on each stratum and with compatible transition conditions, not inferred from static equations.
